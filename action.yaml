name: FixItFast
description: Summarize, review, improve, and fix PRs
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      shell: bash
    - name: Run PR-Agent GitHub runner
      run: python -m pr_agent.servers.github_action_runner
      shell: bash