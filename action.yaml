name: FixItFast
description: Summarize, review, improve, and fix PRs
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: |
        python -m pip install --upgrade pip
        # Install this action's dependencies and package from the action directory,
        # not from the caller repository working directory.
        pip install -r "$GITHUB_ACTION_PATH/requirements.txt"
        python -m pip install "$GITHUB_ACTION_PATH"
        # Install aider in isolated venv to avoid dependency conflicts
        python -m venv "$RUNNER_TEMP/aider-venv"
        "$RUNNER_TEMP/aider-venv/bin/pip" install --upgrade pip
        "$RUNNER_TEMP/aider-venv/bin/pip" install aider-chat
        # Make aider available via environment variable instead of PATH
        echo "AIDER_EXECUTABLE=$RUNNER_TEMP/aider-venv/bin/aider" >> "$GITHUB_ENV"
      shell: bash
    - name: Run PR-Agent GitHub runner
      run: python -m pr_agent.servers.github_action_runner
      shell: bash